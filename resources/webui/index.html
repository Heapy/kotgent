<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover lets the layout reach under the notch/home indicator; style.css pays that back
       with env(safe-area-inset-*) padding. Without it an installed iOS PWA letterboxes the whole app. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kotgent</title>

  <!--
    PWA install surface. On iOS this is not polish: Web Push exists ONLY inside an installed PWA
    (iOS 16.4+), so the manifest and the apple-* meta tags below are the precondition for notifications,
    not a nicety. `black-translucent` draws the app under the status bar, which is what viewport-fit=cover
    and the safe-area padding are for.
  -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kotgent" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />

  <!-- Vendored, offline: pinned @xterm/xterm@5.5.0 + @xterm/addon-fit@0.10.0, preact@10.29.7 + htm@3.1.1. -->
  <link rel="stylesheet" href="vendor/xterm.css" />
  <!-- Query revision forces an already-installed iOS PWA past Safari's persistent HTTP asset cache. -->
  <link rel="stylesheet" href="style.css?v=mobile-swipe-scroll-5" />

  <!--
    No bundler: bare specifiers are resolved to the vendored ES modules by the browser itself. This map
    must precede the first module load, which is why it lives in <head>.
  -->
  <script type="importmap">
  {
    "imports": {
      "preact": "./vendor/preact.module.js",
      "preact/hooks": "./vendor/preact-hooks.module.js",
      "htm": "./vendor/htm.module.js",
      "htm/preact": "./vendor/htm-preact.module.js",
      "qrcode": "./vendor/qrcode.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- data-webui-marker is asserted by test/transport/WebUiServingTest.kt (serving path). -->
  <div id="app" data-webui-marker="kotgent-webui"></div>

  <!-- Classic scripts: xterm publishes the globals the terminal pane uses, and they run before the
       deferred module below. -->
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script type="module" src="app.js?v=mobile-swipe-scroll-5"></script>
</body>
</html>
