<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover lets the layout reach under the notch/home indicator; style.css pays that back
       with env(safe-area-inset-*) padding. Without it an installed iOS PWA letterboxes the whole app. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kotgent</title>

  <!--
    PWA install surface. On iOS this is not polish: Web Push exists ONLY inside an installed PWA
    (iOS 16.4+), so the manifest and the apple-* meta tags below are the precondition for notifications,
    not a nicety. `black-translucent` draws the app under the status bar, which is what viewport-fit=cover
    and the safe-area padding are for.
  -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kotgent" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#000000" />

  <!--
    `__REV__` is replaced by the daemon (src/transport/WebUiAssets.kt) with a content hash of the whole
    resources/webui tree, and anything served under /_v/<rev>/ is `immutable`. One changed byte anywhere
    changes the revision, so an installed PWA cannot keep serving an old module: the URL it cached it
    under no longer exists. This shell itself is `no-cache`, which is what makes the new revision arrive.

    Only the references BELOW carry the prefix. Relative imports inside app.js resolve against app.js's
    own /_v/<rev>/ URL, so the prefix reaches the whole module graph for free — but the importmap resolves
    against the DOCUMENT, so its targets have to spell the prefix out. The manifest and the icons stay on
    stable URLs on purpose: an installed PWA refers to them by a fixed address.
  -->

  <!-- Vendored, offline: pinned @xterm/xterm@6.0.0 + @xterm/addon-fit@0.11.0, preact@10.29.7 + htm@3.1.1. -->
  <link rel="stylesheet" href="/_v/__REV__/vendor/xterm.css" />
  <link rel="stylesheet" href="/_v/__REV__/style.css" />

  <!--
    No bundler: bare specifiers are resolved to the vendored ES modules by the browser itself. This map
    must precede the first module load, which is why it lives in <head>.
  -->
  <script type="importmap">
  {
    "imports": {
      "preact": "/_v/__REV__/vendor/preact.module.js",
      "preact/hooks": "/_v/__REV__/vendor/preact-hooks.module.js",
      "htm": "/_v/__REV__/vendor/htm.module.js",
      "htm/preact": "/_v/__REV__/vendor/htm-preact.module.js",
      "qrcode": "/_v/__REV__/vendor/qrcode.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- data-webui-marker is asserted by test/transport/WebUiServingTest.kt (serving path). -->
  <div id="app" data-webui-marker="kotgent-webui"></div>

  <!-- Classic scripts: xterm publishes the globals the terminal pane uses, and they run before the
       deferred module below. -->
  <script src="/_v/__REV__/vendor/xterm.js"></script>
  <script src="/_v/__REV__/vendor/addon-fit.js"></script>
  <script type="module" src="/_v/__REV__/app.js"></script>
</body>
</html>
