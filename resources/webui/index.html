<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Required for the safe-area padding used by the installed iOS PWA. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kotgent</title>

  <!-- iOS Web Push requires an installed PWA. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kotgent" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#14171c" />

  <!-- WebUiAssets replaces __REV__; import-map targets are document-relative and need the prefix explicitly. -->

  <!-- Vendored: xterm 6.0.0, addon-fit 0.11.0, preact 10.29.8, htm 3.1.1. -->
  <link rel="stylesheet" href="/_v/__REV__/vendor/xterm.css" />
  <link rel="stylesheet" href="/_v/__REV__/style.css" />

  <!-- The import map must precede the first module load. -->
  <script type="importmap">
  {
    "imports": {
      "preact": "/_v/__REV__/vendor/preact.module.js",
      "preact/hooks": "/_v/__REV__/vendor/preact-hooks.module.js",
      "htm": "/_v/__REV__/vendor/htm.module.js",
      "htm/preact": "/_v/__REV__/vendor/htm-preact.module.js",
      "qrcode": "/_v/__REV__/vendor/qrcode.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app" data-webui-marker="kotgent-webui"></div>

  <!-- xterm globals must exist before app.js loads. -->
  <script src="/_v/__REV__/vendor/xterm.js"></script>
  <script src="/_v/__REV__/vendor/addon-fit.js"></script>
  <script type="module" src="/_v/__REV__/app.js"></script>
</body>
</html>
