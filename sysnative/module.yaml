# Owns native POSIX/cinterop bindings.
product:
  type: kmp/lib
  platforms: [macosArm64, linuxX64, linuxArm64]

dependencies:
  # Pty.output exposes Channel, so consumers need this dependency exported.
  - $libs.kotlinx.coroutines.core:
      exported: true

settings:
  kotlin:
    version: 2.4.20
    freeCompilerArgs:
      - -Xreturn-value-checker=full
      - -Xname-based-destructuring=complete

# Toolchain auto-discovers cinterop/*.def. cinterop/include links the pinned decoder source;
# the zstd definition compiles it into the binding, with no dynamic libzstd dependency.
