# Owns native POSIX/cinterop bindings. Toolchain 0.11 links custom cinterop only into main binaries
# (KT-78062), so real-PTY assertions run through the `ptycheck` main app.
product:
  type: kmp/lib
  platforms: [macosArm64]

dependencies:
  # Pty.output exposes Channel, so consumers need this dependency exported.
  - $libs.kotlinx.coroutines.core:
      exported: true

settings:
  kotlin:
    version: 2.4.10

# Toolchain auto-discovers cinterop/pty.def; no YAML cinterop wiring is required.
