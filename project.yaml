modules:
  # Shared test doubles (FakeTmux, FakeEventStore, FakeTaskStore, FakeProjectFs,
  # MemoryProjectFileWriter). A real module because it has two consumers: the root module's TEST
  # fragment and the `webuicheck` MAIN binary. See fakes/module.yaml for why root(test) -> fakes ->
  # root(main) is a DAG and not a cycle.
  - ./fakes
  # Build-time VERSION/Git metadata generator for the native application.
  - ./plugins/build-info
  # The codegen plugin is also a normal (jvm/amper-plugin) module and must be listed here.
  - ./plugins/sqldelight-gen
  # Test fixture: a MAIN binary that runs the real-PTY checks a test binary cannot (KT-78062).
  # Driven from the suite by `PtyTest`, which execs it. See ptycheck/module.yaml.
  - ./ptycheck
  - ./sysnative

plugins:
  - ./plugins/build-info
  # Register the SQLDelight codegen plugin so modules can enable it (root module.yaml).
  - ./plugins/sqldelight-gen
