# Browser fixture main binary: Toolchain 0.11 cannot link custom cinterop into tests (KT-78062).
# It may use only an ephemeral loopback port and scenario PTYs; tokens, tmux, stores, uploads,
# directory completion, and project-file writes must remain in memory.
product:
  type: macos/app
  platforms: [macosArm64]

dependencies:
  - ..
  # Supplies the real PTY plus its exported coroutines types.
  - ../sysnative
  - ../fakes
  # Root does not export Ktor, but the in-memory uploader must implement its public channel type.
  - $libs.ktor.server.cio

settings:
  kotlin:
    version: 2.4.10
  native:
    entryPoint: io.kotgent.webuicheck.main
