# Browser fixture main binary driven by the `webuitest` Playwright tier.
# It may use only an ephemeral loopback port and scenario PTYs; tokens, tmux, stores, uploads,
# directory completion, and project-file writes must remain in memory.
product:
  type: kmp/lib
  platforms: [macosArm64, linuxX64, linuxArm64]

apply:
  - //linux-libraries.module-template.yaml

dependencies:
  - ..
  # Supplies the real PTY plus its exported coroutines types.
  - ../sysnative
  - ../fakes
  # Root does not export Ktor, but the in-memory uploader must implement its public channel type.
  - $libs.ktor.server.cio
  - $libs.sqldelight.native.driver

settings:
  kotlin:
    version: 2.4.20
    freeCompilerArgs:
      - -linker-option
      - -lsqlite3
      - -Xreturn-value-checker=full
      - -Xname-based-destructuring=complete
