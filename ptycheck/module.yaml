# Main-binary fixture for real-PTY checks: Toolchain 0.11 omits custom cinterop from test binaries
# (KT-78062). `PtyTest` therefore execs this artifact, which `./kotlin build` must link first.
product:
  type: macos/app
  platforms: [macosArm64]

dependencies:
  - ../sysnative
  # One check crosses Pty into TerminalBridge's fan-out over a real tmux attach.
  - ..

settings:
  kotlin:
    version: 2.4.10
  native:
    entryPoint: io.kotgent.ptycheck.main
