[versions]
coroutines = "1.11.0"
ktor = "3.5.1"
# Playwright for Java — the browser tier's whole toolchain. Deliberately NOT npm: the Node driver ships
# inside the Maven artifact, so there is no package.json, no node_modules and no `npx playwright install`,
# and `resources/webui` keeps its no-build property. Two couplings ride on this literal. The browser
# bundle the driver demands is pinned by the version, and `.github/workflows/ci.yml` spells it out in the
# Playwright cache key WITHOUT restore-keys — bump both in the same commit or CI restores a bundle the new
# driver ignores and re-downloads over. Dependabot will not do it: `.github/dependabot.yml` records that
# this catalog is intentionally untracked (its gradle ecosystem needs a build.gradle(.kts) this repo has
# by design not got), so the bump is manual.
playwright = "1.62.0"
sqldelight = "2.3.2"
sql-psi = "0.7.3"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
sqldelight-compiler-env = { module = "app.cash.sqldelight:compiler-env", version.ref = "sqldelight" }
sqldelight-core = { module = "app.cash.sqldelight:core", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-dialect = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
sql-psi-environment = { module = "app.cash.sql-psi:environment", version.ref = "sql-psi" }
