[versions]
# ktc-plugins begin sqldelight versions
ktc-sqldelight-sqldelight = "2.3.2"
# ktc-plugins end sqldelight versions
coroutines = "1.11.0"
komok = "1.2.0"
ktor = "3.6.0"
# Keep the literal Playwright version in .github/workflows/ci.yml's browser-cache key in sync.
playwright = "1.62.0"

[libraries]
# ktc-plugins begin sqldelight
ktc-sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "ktc-sqldelight-sqldelight" }
ktc-sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "ktc-sqldelight-sqldelight" }
ktc-sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "ktc-sqldelight-sqldelight" }
ktc-sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "ktc-sqldelight-sqldelight" }
# ktc-plugins end sqldelight
komok-tech-to-be-injected = { module = "io.heapy.komok:komok-tech-to-be-injected", version.ref = "komok" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-curl = { module = "io.ktor:ktor-client-curl", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
