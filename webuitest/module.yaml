# JVM test-only module because Playwright cannot run in the native suite.
# JUnit discovery requires every test class name to match `.*Tests?`; other names silently yield no tests.
# Browser tests need the built Web UI and webuicheck binary; Playwright embeds its Node driver.
# WebUiLogicTest and component probes also need Node v24+ on PATH and webui/node_modules.
# Run npm ci and npm run build in webui/ before the Kotlin build and tests.
product: jvm/lib

test-dependencies:
  - $libs.playwright

settings:
  kotlin:
    version: 2.4.20
    freeCompilerArgs:
      - -Xreturn-value-checker=full
      - -Xname-based-destructuring=complete
