# Toolchain cannot load Gradle plugins, so this JVM build plugin invokes SQLDelight directly.
product: jvm/amper-plugin

dependencies:
  - app.cash.sqldelight:core:2.3.2
  # ServiceLoader needs a concrete dialect on the build-plugin classpath.
  - app.cash.sqldelight:sqlite-3-38-dialect:2.3.2
  - app.cash.sql-psi:environment:0.7.3
  - app.cash.sqldelight:compiler-env:2.3.2

settings:
  kotlin:
    version: 2.4.20
    freeCompilerArgs:
      - -Xreturn-value-checker=full
      - -Xname-based-destructuring=complete
