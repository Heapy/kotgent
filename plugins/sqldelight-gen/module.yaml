# Toolchain cannot load Gradle plugins, so this JVM build plugin invokes SQLDelight directly.
product: jvm/amper-plugin

dependencies:
  - $libs.sqldelight.core
  # ServiceLoader needs a concrete dialect on the build-plugin classpath.
  - $libs.sqldelight.sqlite.dialect
  - $libs.sql.psi.environment
  - $libs.sqldelight.compiler.env

settings:
  kotlin:
    version: 2.4.10
