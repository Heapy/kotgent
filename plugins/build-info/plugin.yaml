tasks:
  generate:
    action: !io.kotgent.buildinfo.generateBuildInfo
      # A project-root input would overlap taskOutputDir and snapshot build artifacts.
      versionFile: ${project.rootDir}/version.txt
      generatedSourceDir: ${taskOutputDir}
  # Derive the build root from this task output; naming the parameter taskOutputDir creates a reference loop.
  printDebugKexePath:
    action: !io.kotgent.buildinfo.printKexePath
      outputDir: ${taskOutputDir}
      moduleName: ${module.name}
      buildType: Debug
  printReleaseKexePath:
    action: !io.kotgent.buildinfo.printKexePath
      outputDir: ${taskOutputDir}
      moduleName: ${module.name}
      buildType: Release

generated:
  sources:
    - language: kotlin
      directory: ${tasks.generate.action.generatedSourceDir}

commands:
  - name: kexePath
    performedBy: printDebugKexePath
  - name: releaseKexePath
    performedBy: printReleaseKexePath
