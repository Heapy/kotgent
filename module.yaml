product:
  type: macos/app
  platforms: [macosArm64]

plugins:
  build-info: enabled
  sqldelight-gen: enabled

dependencies:
  - ./sysnative
  - $libs.kotlinx.coroutines.core
  - $libs.ktor.server.cio
  - $libs.ktor.server.websockets
  - $libs.ktor.client.cio
  - $libs.ktor.client.websockets
  # Native CIO has no TLS support; Web Push uses Darwin/NSURLSession.
  - $libs.ktor.client.darwin
  - $libs.sqldelight.native.driver

test-dependencies:
  - ./fakes
  - $libs.ktor.client.mock

settings:
  kotlin:
    version: 2.4.10
    serialization:
      format: json
      version: 1.11.0
    # Toolchain 0.11.x does not propagate sqliter's -lsqlite3 linker option to the final native link.
    freeCompilerArgs: [-linker-option, -lsqlite3]
  native:
    entryPoint: io.kotgent.main
