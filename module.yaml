product:
  type: macos/app
  platforms: [macosArm64]

plugins:
  # Custom Kotlin Toolchain plugin (plugins/sqldelight-gen) that runs SQLDelight codegen from
  # sqldelight/*.sq into this module's compilation. See plugins/sqldelight-gen/plugin.yaml.
  sqldelight-gen: enabled

dependencies:
  # sysnative owns the PTY cinterop (and future POSIX/tmux/sqlite bindings). Depending on
  # it links sysnative's auto-discovered cinterop klib into this app's MAIN binary as a
  # normal module dependency — the old machine-specific absolute -library test workaround
  # is gone. KNOWN BLOCKER: Kotlin Toolchain 0.11.0 does NOT link cinterop into any TEST
  # binary (KT-78062), so the PTY integration tests are @Ignore'd (see plan Task 2 blocker).
  - ./sysnative
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0
  # Ktor CIO server + WebSockets — transport foundation (Task 3 spike, real Server in Task 14).
  # Versions come from the BOM/catalog that `settings.ktor: enabled` provides (default 3.4.1).
  - io.ktor:ktor-server-cio
  - io.ktor:ktor-server-websockets
  # SQLDelight runtime native SQLite driver (Task 4 storage spike). The toolchain resolves the
  # macosArm64 variant (native-driver-macosarm64.klib) via Gradle Module Metadata, exactly like
  # Ktor's native artifacts. It is a THIRD-PARTY klib (its own sqliter-driver cinterop to sqlite3),
  # so — unlike our own raw pty.def cinterop (KT-78062) — it links into the TEST binary fine
  # (proven by the Ktor precedent in Task 3). Version matches the compiler used by the codegen
  # plugin (2.3.2, built with Kotlin 2.3.10 — klib-compatible with our 2.4.10).
  - app.cash.sqldelight:native-driver:2.3.2

test-dependencies:
  # Ktor CIO client (+ client WebSockets) drives the SpikeServer round-trips in WsSpikeTest.
  - io.ktor:ktor-client-cio
  - io.ktor:ktor-client-websockets

settings:
  kotlin:
    version: 2.4.10
    serialization: json
    # SQLDelight's native-driver depends on co.touchlab:sqliter-driver, whose cinterop calls
    # the system SQLite (sqlite3_* symbols). Sqliter's own `linkerOpts = -lsqlite3` is NOT
    # propagated to the final Kotlin/Native link by toolchain 0.11.0, so both the main and test
    # binaries fail with `ld: symbol(s) not found` for _sqlite3_*. We pass the flag ourselves.
    # This is PORTABLE (unlike the removed Task-2 absolute -library path hack): -lsqlite3 is a
    # standard system library present in every macOS SDK; the linker finds it with no -L path.
    freeCompilerArgs: [-linker-option, -lsqlite3]
  native:
    entryPoint: io.kotgent.main
  ktor: enabled
