product:
  type: macos/app
  platforms: [macosArm64]

dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0

settings:
  kotlin:
    version: 2.4.10
    serialization: json
  native:
    entryPoint: io.kotgent.main

# WORKAROUND (Kotlin Toolchain 0.11.0 AND 0.11.1 == current latest) -- Task 2 spike finding:
# Auto-discovered cinterop klibs (cinterop/pty.def -> build .../pty.klib) are linked into the
# MAIN executable (linkMacosArm64Debug depends on cinteropMacosArm64) but NOT into the TEST
# executable: linkMacosArm64TestDebug never receives `-library=...pty.klib`, so kotgent.klib's
# transitive `pty` dependency is unresolved and partial linkage stubs every cinterop function,
# throwing IrLinkageError at runtime (proven: the test .kexe contains zero cinterop_pty symbols).
# `./kotlin build` alone is fine; only `./kotlin test` needs this. We re-add the generated klib
# explicitly to the test compilation/link.
#
# The path MUST be absolute: konanc resolves a non-absolute `-library` value as a repo NAME
# (searched only in the konan distribution dirs), not as a project-relative file, and module.yaml
# has no variable substitution -- so a portable relative form is not possible here. Update this
# path if the project is moved, or remove the whole block if a future toolchain wires
# auto-cinterop into tests (or if the cinterop is split into a dedicated dependency module).
test-settings:
  kotlin:
    freeCompilerArgs:
      - "-library=/Users/yoda/dev/pet/kotgent/build/artifacts/CinteropKlibsArtifact/kotgentmacosArm64/pty.klib"
