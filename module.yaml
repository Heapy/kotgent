product:
  type: kmp/lib
  platforms: [macosArm64, linuxX64, linuxArm64]

apply:
  - //linux-libraries.module-template.yaml

plugins:
  build-info: enabled
  sqldelight-gen: enabled

dependencies:
  - ./sysnative
  - $libs.komok.tech.to.be.injected
  - $libs.kotlinx.coroutines.core
  - $libs.ktor.server.cio
  - $libs.ktor.server.websockets
  - $libs.ktor.client.cio
  - $libs.ktor.client.websockets
  - $libs.sqldelight.native.driver

dependencies@macos:
  - $libs.ktor.client.darwin

dependencies@linux:
  - $libs.ktor.client.curl

test-dependencies:
  - ./fakes
  - $libs.ktor.client.mock

settings:
  kotlin:
    version: 2.4.10
    serialization:
      format: json
      version: 1.11.0
    # SQLiter's linker option does not reach the final native link.
    freeCompilerArgs:
      - -linker-option
      - -lsqlite3
      - -Xreturn-value-checker=full
      - -Xname-based-destructuring=complete
