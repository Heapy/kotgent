# Shared doubles live in a main module because both `webuicheck` and root tests consume them;
# test-specific doubles keep their race hooks beside the subject.
# Toolchain 0.11 resolves root(test) -> fakes -> root(main) as a fragment DAG, not a module cycle.
# It also has no cross-module test friends, so declarations in `src/` must be public.
product:
  type: kmp/lib
  platforms: [macosArm64]

dependencies:
  - ..
  # Root does not export coroutines, while these public fake APIs expose its types.
  - $libs.kotlinx.coroutines.core

settings:
  kotlin:
    version: 2.4.10
