# Shared doubles live in a main module because both `webuicheck` and root tests consume them.
# Per-test behavior comes from race hooks and FakeStoreInterceptor rather than private fake copies.
# The root(test) -> fakes -> root(main) fragment graph is not a module cycle. Cross-module tests have
# no friend access, so declarations in `src/` must be public.
product:
  type: kmp/lib
  platforms: [macosArm64]

dependencies:
  - ..
  # Root does not export coroutines, while these public fake APIs expose its types.
  - $libs.kotlinx.coroutines.core

settings:
  kotlin:
    version: 2.4.10
    freeCompilerArgs:
      - -Xreturn-value-checker=full
      - -Xname-based-destructuring=complete
