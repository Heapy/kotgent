name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install tmux (real-PTY integration checks)
        run: brew install tmux

      # This key does not hash nested module.yaml files.
      - name: Cache the Kotlin toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.kotlin
            .kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', 'module.yaml') }}
          restore-keys: kotlin-toolchain-${{ runner.os }}-

      # Keep this literal in sync with gradle/libs.versions.toml; restore-keys would retain obsolete bundles.
      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-1.62.0

      # Tests execute ptycheck and webuicheck but do not build those main binaries.
      - name: Build
        run: ./kotlin build

      - name: Test
        run: ./kotlin test

      # Preserve the original test failure if no browser diagnostics were produced.
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: |
            test-results/
            webuitest/test-results/
          if-no-files-found: ignore
          retention-days: 7
